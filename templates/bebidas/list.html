{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <h2 class="fw-bold text-primary">Lista de Bebidas 🥤</h2>
    <a href="{{ url_for('crear_bebida') }}" class="btn btn-success mb-3">➕ Nueva Bebida</a>

    <div class="table-responsive">
    <table class="table table-striped table-bordered">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Tamaño</th>
                <th>Precio</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for bebida in bebidas %}
            <tr>
                <td>{{ bebida.id }}</td>
                <td>{{ bebida.nombre }}</td>
                <td>{{ bebida.tamaño }}</td>
                <td>${{ "%.2f"|format(bebida.precio) }}</td>
                <td>
                    <a href="{{ url_for('editar_bebida', bid=bebida.id) }}" class="btn btn-warning btn-sm">✏ Editar</a>
                    <form action="{{ url_for('eliminar_bebida', bid=bebida.id) }}" method="POST" style="display:inline;">
                        <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('¿Eliminar esta bebida?')">🗑 Eliminar</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
