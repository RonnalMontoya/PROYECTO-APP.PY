{% extends "base.html" %}
{% block content %}
<div class="container mt-5 col-md-6">
    <h2 class="text-success">
        {% if modo == 'crear' %}➕ Nuevo Cliente{% else %}✏️ Editar Cliente{% endif %}
    </h2>
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" class="form-control" name="nombre" value="{{ cliente.nombre if modo == 'editar' else '' }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" name="email" value="{{ cliente.email if modo == 'editar' else '' }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Teléfono</label>
            <input type="text" class="form-control" name="telefono" value="{{ cliente.telefono if modo == 'editar' else '' }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Dirección</label>
            <textarea class="form-control" name="direccion">{{ cliente.direccion if modo == 'editar' else '' }}</textarea>
        </div>
        <button type="submit" class="btn btn-success">Guardar</button>
        <a href="{{ url_for('listar_clientes') }}" class="btn btn-secondary">Volver</a>
    </form>
</div>
{% endblock %}
