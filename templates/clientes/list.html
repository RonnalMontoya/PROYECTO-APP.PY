{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <h2 class="text-primary mb-4">
        📋 Lista de Clientes
    </h2>
    <a href="{{ url_for('crear_cliente') }}" class="btn btn-success mb-3">
        ➕ Nuevo Cliente
    </a>

    <div class="table-responsive">
    <table class="table table-striped table-bordered">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Email</th>
                <th>Teléfono</th>
                <th>Dirección</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for cliente in clientes %}
            <tr>
                <td>{{ cliente.id }}</td>
                <td>{{ cliente.nombre }}</td>
                <td>{{ cliente.email }}</td>
                <td>{{ cliente.telefono }}</td>
                <td>{{ cliente.direccion }}</td>
                <td>
                    <a href="{{ url_for('editar_cliente', cid=cliente.id) }}" class="btn btn-warning btn-sm">✏ Editar</a>
                    <form action="{{ url_for('eliminar_cliente', cid=cliente.id) }}" method="POST" style="display:inline;">
                        <button type="submit" class="btn btn-danger btn-sm">🗑 Eliminar</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

{% endblock %}
