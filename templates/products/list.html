{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2 class="mb-3">📦 Productos</h2>

    <!-- Barra de búsqueda y botón nuevo -->
    <form method="GET" action="{{ url_for('listar_productos') }}" class="row mb-3">
        <div class="col-md-8">
            <input type="text" name="q" value="{{ q }}" class="form-control" placeholder="Buscar por nombre">
        </div>
        <div class="col-md-2">
            <button type="submit" class="btn btn-primary w-100">Buscar</button>
        </div>
        <div class="col-md-2">
            <a href="{{ url_for('crear_producto') }}" class="btn btn-success w-100">+ Nuevo</a>
        </div>
    </form>

    <!-- Tabla de productos -->
    <div class="table-responsive">
    <table class="table table-striped table-bordered">
        <thead class="table-dark">
                <tr>
                    <th>Nombre</th>
                    <th>Cantidad</th>
                    <th>Precio</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                {% for p in productos %}
                <tr>
                    <td>{{ p.nombre }}</td>
                    <td>{{ p.cantidad }}</td>
                    <td>${{ "%.2f"|format(p.precio) }}</td>
                    <td>
                        <a href="{{ url_for('editar_producto', pid=p.id) }}" class="btn btn-warning btn-sm">Editar</a>
                        <form method="POST" action="{{ url_for('eliminar_producto', pid=p.id) }}" style="display:inline;">
                            <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('¿Seguro que quieres eliminar este producto?')">Eliminar</button>
                        </form>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="4" class="text-center text-muted">No hay productos registrados</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
